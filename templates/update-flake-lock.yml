# Copy to .github/workflows/update-flake-lock.yml in your system-config repository.
# It runs `nix flake update` every day and pushes flake.lock when an input moved.
name: update-flake-lock

on:
  schedule:
    - cron: "41 20 * * *" # 05:41 JST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v32

      - run: nix flake update

      - name: Evaluate every NixOS configuration before the lock file lands
        run: |
          for host in $(nix eval --json .#nixosConfigurations --apply builtins.attrNames | jq -r '.[]'); do
            nix eval --raw ".#nixosConfigurations.$host.config.system.build.toplevel.drvPath"
            echo
          done

      - name: Push flake.lock
        run: |
          git diff --quiet -- flake.lock && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "flake.lock: update" -- flake.lock
          git push
